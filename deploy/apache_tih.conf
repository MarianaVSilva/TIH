# /etc/apache2/sites-available/tih.conf
#
# Publica el sitio en un PUERTO DEDICADO NUEVO (8091) para NO tocar los vhosts
# existentes (mvt_mapa en :80/:8000, precios_gasolina en :8090, pnih, mvt_admin).
# Frontend (Vite build) servido como estático directo por Apache; /api
# proxeado al backend FastAPI en 127.0.0.1:8005.
#
# El sitio queda en:  http://172.16.83.21:8091/
#
# Instalar:
#   sudo cp deploy/apache_tih.conf /etc/apache2/sites-available/tih.conf
#   sudo a2enmod proxy proxy_http headers      # (probablemente ya están activos)
#   sudo a2ensite tih
#   sudo apache2ctl configtest                  # DEBE decir "Syntax OK" antes de recargar
#   sudo systemctl reload apache2

# No revelar version de Apache/OS en cabeceras ni en paginas de error. Estas
# dos directivas son globales; si ya estan puestas en otro conf del servidor,
# Apache toma la ultima y no pasa nada por repetirlas aqui.
ServerTokens Prod
ServerSignature Off
# Apagar TRACE/TRACK (Cross-Site Tracing). Global, afecta a todo Apache.
TraceEnable Off

Listen 8091

<VirtualHost *:8091>
    ServerName 172.16.83.21

    DocumentRoot /opt/tih/frontend/dist

    # ── Cabeceras de seguridad para TODO lo que sirve este sitio ──────────
    # Requiere mod_headers (sudo a2enmod headers). Aqui es donde vive la CSP
    # que protege la aplicacion: el HTML lo sirve Apache, no FastAPI.
    #
    # 'unsafe-inline' en style-src: el build de Vite y ECharts inyectan estilos
    # en linea; quitarlo rompe el tablero. script-src queda SIN unsafe-inline
    # ni unsafe-eval — es lo que de verdad frena un XSS. connect-src 'self'
    # basta porque el frontend habla con /api del mismo origen.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    # HSTS: SOLO tiene sentido cuando el sitio sirva por HTTPS. Mientras siga en
    # HTTP plano (puerto 8091) dejarlo puesto no protege y puede estorbar, asi
    # que va comentado hasta que haya TLS. Al migrar a HTTPS, descomentar:
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    <Directory /opt/tih/frontend/dist>
        Options -Indexes
        AllowOverride None
        Require all granted
        # SPA: cualquier ruta que no sea un archivo real cae en index.html
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 120

    ProxyPass        /api http://127.0.0.1:8005/api
    ProxyPassReverse /api http://127.0.0.1:8005/api

    # El backend (uvicorn/gunicorn) manda su propia cabecera Server, que revela
    # el motor. Se borra en el borde para no delatarlo.
    <Location /api>
        Header always unset Server
    </Location>

    RequestHeader set X-Forwarded-Proto "http"

    # Limitar el tamano del cuerpo de una peticion a 2 MB en el borde (defensa
    # aparte del tope del backend). Los POST del API son diminutos.
    LimitRequestBody 2097152

    ErrorLog  ${APACHE_LOG_DIR}/tih_error.log
    CustomLog ${APACHE_LOG_DIR}/tih_access.log combined
</VirtualHost>
